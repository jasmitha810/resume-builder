<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Animated Resume & Portfolio Builder</title>
    <!-- FontAwesome for LinkedIn, GitHub, and action icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080c14;
            color: #f3f4f6;
            min-height: 100vh;
        }

        /* Top Bar Header */
        header {
            background: #0f172a;
            padding: 15px 30px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 9px 18px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .btn-primary { background: #6366f1; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-add { background: #3b82f6; color: white; margin-bottom: 15px; width: 100%; justify-content: center; }
        .btn-danger { background: #ef4444; color: white; padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; margin-top: 6px; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Split-screen Layout */
        .main-container {
            display: flex;
            height: calc(100vh - 65px);
        }

        /* Left Side: Form Controls */
        .controls-panel {
            width: 40%;
            background: #0f172a;
            padding: 25px;
            overflow-y: auto;
            border-right: 1px solid #1e293b;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .project-input-block {
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: #9ca3af;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #818cf8;
        }

        /* Right Side: Live Interactive Resume Preview */
        .preview-panel {
            width: 60%;
            padding: 30px;
            overflow-y: auto;
            background: #080c14;
            display: flex;
            justify-content: center;
        }

        /* Resume Document Container */
        #resume-paper {
            width: 100%;
            max-width: 680px;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 35px;
            color: #f3f4f6;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Profile Header Box */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 25px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 25px;
            margin-bottom: 25px;
        }

        .avatar-box {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #6366f1;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
            flex-shrink: 0;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-info {
            flex-grow: 1;
        }

        .resume-name {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .resume-email {
            color: #9ca3af;
            font-size: 0.85rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .resume-title {
            color: #38bdf8;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .social-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .social-links-btns {
            display: flex;
            gap: 12px;
        }

        .social-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            background: #1e293b;
            color: #e2e8f0;
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid #334155;
            transition: all 0.3s ease;
        }

        .social-link-btn:hover {
            border-color: #818cf8;
            color: #818cf8;
            transform: translateY(-2px);
        }

        .pdf-url-text {
            display: none;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .pdf-url-text a {
            color: #2563eb;
            text-decoration: underline;
            font-weight: 600;
            word-break: break-all;
        }

        /* Animated Interactive Section Cards */
        .animated-card {
            background: #162032;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .project-item {
            border-bottom: 1px solid #1e293b;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .project-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        .education-card {
            padding: 26px;
            min-height: 110px;
        }

        .animated-card:hover {
            border-color: #6366f1;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.15);
        }

        .section-title {
            font-size: 1rem;
            color: #818cf8;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .resume-bio {
            color: #9ca3af;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .skills-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-chip {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Print / PDF Formatting Settings */
        @media print {
            body * { visibility: hidden; }
            .preview-panel, #resume-paper, #resume-paper * { visibility: visible; }
            .preview-panel { position: absolute; left: 0; top: 0; width: 100%; padding: 0; background: #fff !important; }
            #resume-paper { border: none; background: #ffffff !important; color: #000000 !important; box-shadow: none; }
            .resume-name { color: #000000 !important; }
            .resume-email { color: #4b5563 !important; }
            .resume-title { color: #0284c7 !important; }
            .animated-card { background: #f8fafc !important; border: 1px solid #e2e8f0 !important; }
            .resume-bio { color: #334155 !important; }
            .section-title { color: #4f46e5 !important; }
            .skill-chip { background: #e0e7ff !important; color: #3730a3 !important; border: none; }
            
            /* Show Hyperlinks Clearly on PDF Print */
            .social-links-btns { display: none !important; }
            .pdf-url-text { display: block !important; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fas fa-magic"></i> Live Resume Builder</div>
        <div class="export-buttons">
            <button class="btn btn-primary" onclick="exportHTML()"><i class="fas fa-code"></i> Download Web (.html)</button>
            <button class="btn btn-success" onclick="exportPDF()"><i class="fas fa-file-pdf"></i> Save as PDF</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Controls Panel (Left Input Form) -->
        <div class="controls-panel">
            <div class="form-group">
                <label>Profile Picture</label>
                <input type="file" id="input-photo" accept="image/*" onchange="loadPhoto(event)">
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="input-name" value="Alex Morgan" oninput="updatePreview()">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="input-email" value="alex.morgan@example.com" oninput="updatePreview()">
            </div>

            <div class="form-group">
                <label>Job Title / Degree</label>
                <input type="text" id="input-title" value="Full Stack Developer & CSE Student" oninput="updatePreview()">
            </div>

            <div class="form-group">
                <label>LinkedIn Profile URL</label>
                <input type="text" id="input-linkedin" value="https://linkedin.com/in/alexmorgan" oninput="updatePreview()">
            </div>

            <div class="form-group">
                <label>GitHub Profile URL</label>
                <input type="text" id="input-github" value="https://github.com/alexmorgan" oninput="updatePreview()">
            </div>

            <div class="form-group">
                <label>Short Bio</label>
                <textarea id="input-bio" rows="3" oninput="updatePreview()">Passionate developer building fast web applications, automation scripts, and interactive software interfaces.</textarea>
            </div>

            <div class="form-group">
                <label>Skills (comma separated)</label>
                <input type="text" id="input-skills" value="HTML5/CSS3, JavaScript, Python, C++, Git, UI Design" oninput="updatePreview()">
            </div>

            <!-- Dynamic Projects Container -->
            <div class="form-group">
                <label>Projects</label>
                <div id="projects-inputs-container">
                    <div class="project-input-block">
                        <input type="text" class="proj-title-input" value="AI Portfolio Generator" placeholder="Project Title" oninput="updatePreview()" style="margin-bottom:6px;">
                        <textarea class="proj-desc-input" rows="2" placeholder="Project Description" oninput="updatePreview()">Built an interactive web platform enabling non-coders to generate and export tailored resume websites in real-time.</textarea>
                    </div>
                </div>
                <button type="button" class="btn btn-add" onclick="addProjectInput()"><i class="fas fa-plus"></i> Add Another Project</button>
            </div>

            <div class="form-group">
                <label>Education & University</label>
                <textarea id="input-edu" rows="2" oninput="updatePreview()">B.E. Computer Science and Engineering&#10;Sathyabama Institute of Science and Technology (2024 - Present)</textarea>
            </div>
        </div>

        <!-- Live Resume Preview Panel (Right Side) -->
        <div class="preview-panel">
            <div id="resume-paper">
                <!-- Profile Header -->
                <div class="profile-header">
                    <div class="avatar-box">
                        <img id="view-photo" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" alt="Profile Picture">
                    </div>
                    <div class="header-info">
                        <div class="resume-name" id="view-name">Alex Morgan</div>
                        <div class="resume-email" id="view-email"><i class="fas fa-envelope"></i> alex.morgan@example.com</div>
                        <div class="resume-title" id="view-title">Full Stack Developer & CSE Student</div>
                        
                        <div class="social-row">
                            <!-- Interactive Web Buttons -->
                            <div class="social-links-btns">
                                <a href="#" id="view-linkedin-btn" target="_blank" class="social-link-btn"><i class="fab fa-linkedin"></i> LinkedIn</a>
                                <a href="#" id="view-github-btn" target="_blank" class="social-link-btn"><i class="fab fa-github"></i> GitHub</a>
                            </div>
                            <!-- Clickable Active Links Visible in PDF Mode -->
                            <div class="pdf-url-text" id="pdf-linkedin-url"><i class="fab fa-linkedin"></i> LinkedIn: <a id="pdf-linkedin-link" href="#" target="_blank"></a></div>
                            <div class="pdf-url-text" id="pdf-github-url"><i class="fab fa-github"></i> GitHub: <a id="pdf-github-link" href="#" target="_blank"></a></div>
                        </div>
                    </div>
                </div>

                <!-- Bio Card -->
                <div class="animated-card">
                    <div class="section-title"><i class="fas fa-user"></i> About Me</div>
                    <p class="resume-bio" id="view-bio">Passionate developer building fast web applications and automation scripts.</p>
                </div>

                <!-- Skills Card -->
                <div class="animated-card">
                    <div class="section-title"><i class="fas fa-code"></i> Technical Skills</div>
                    <div class="skills-wrapper" id="view-skills"></div>
                </div>

                <!-- Multiple Projects Card -->
                <div class="animated-card">
                    <div class="section-title"><i class="fas fa-rocket"></i> Projects</div>
                    <div id="view-projects-container"></div>
                </div>

                <!-- Expanded Education Card -->
                <div class="animated-card education-card">
                    <div class="section-title"><i class="fas fa-graduation-cap"></i> Education</div>
                    <p style="color:#e2e8f0; font-size:0.95rem; line-height:1.6; white-space: pre-line;" id="view-edu"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Profile Image Upload
        function loadPhoto(event) {
            const photoImg = document.getElementById('view-photo');
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    photoImg.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // Add New Project Fields Dynamically
        function addProjectInput() {
            const container = document.getElementById('projects-inputs-container');
            const block = document.createElement('div');
            block.className = 'project-input-block';
            block.innerHTML = `
                <input type="text" class="proj-title-input" placeholder="Project Title" oninput="updatePreview()" style="margin-bottom:6px;">
                <textarea class="proj-desc-input" rows="2" placeholder="Project Description" oninput="updatePreview()"></textarea>
                <button type="button" class="btn btn-danger" onclick="removeProjectInput(this)">Remove</button>
            `;
            container.appendChild(block);
            updatePreview();
        }

        // Remove Project Field
        function removeProjectInput(button) {
            button.parentElement.remove();
            updatePreview();
        }

        // Real-Time Preview Update Function
        function updatePreview() {
            document.getElementById('view-name').innerText = document.getElementById('input-name').value || "Your Name";
            
            const emailVal = document.getElementById('input-email').value;
            document.getElementById('view-email').innerHTML = emailVal ? `<i class="fas fa-envelope"></i> ${emailVal}` : "";
            
            document.getElementById('view-title').innerText = document.getElementById('input-title').value || "Your Title";
            document.getElementById('view-bio').innerText = document.getElementById('input-bio').value || "";
            document.getElementById('view-edu').innerText = document.getElementById('input-edu').value || "";

            // Sync Social Links
            const linkedinUrl = document.getElementById('input-linkedin').value.trim();
            const githubUrl = document.getElementById('input-github').value.trim();
            
            document.getElementById('view-linkedin-btn').href = linkedinUrl || "#";
            document.getElementById('view-github-btn').href = githubUrl || "#";

            // Clickable PDF Links
            const pdfLinkedin = document.getElementById('pdf-linkedin-link');
            pdfLinkedin.href = linkedinUrl || "#";
            pdfLinkedin.innerText = linkedinUrl || "N/A";

            const pdfGithub = document.getElementById('pdf-github-link');
            pdfGithub.href = githubUrl || "#";
            pdfGithub.innerText = githubUrl || "N/A";

            // Update Multiple Projects in Preview
            const projTitles = document.querySelectorAll('.proj-title-input');
            const projDescs = document.querySelectorAll('.proj-desc-input');
            const viewProjContainer = document.getElementById('view-projects-container');
            viewProjContainer.innerHTML = '';

            projTitles.forEach((titleInput, index) => {
                const title = titleInput.value.trim();
                const desc = projDescs[index] ? projDescs[index].value.trim() : "";
                
                if (title || desc) {
                    const item = document.createElement('div');
                    item.className = 'project-item';
                    item.innerHTML = `
                        <h4 style="color:#ffffff; font-size:1.05rem;">${title}</h4>
                        <p style="color:#9ca3af; font-size:0.9rem; margin-top:4px; line-height:1.5;">${desc}</p>
                    `;
                    viewProjContainer.appendChild(item);
                }
            });

            // Skills Formatting
            const rawSkills = document.getElementById('input-skills').value.split(',');
            const skillsContainer = document.getElementById('view-skills');
            skillsContainer.innerHTML = '';
            rawSkills.forEach(skill => {
                if(skill.trim()) {
                    const badge = document.createElement('span');
                    badge.className = 'skill-chip';
                    badge.innerText = skill.trim();
                    skillsContainer.appendChild(badge);
                }
            });
        }

        // Initialize preview on load
        updatePreview();

        // Download Web Application File (.html)
        function exportHTML() {
            const paperContent = document.getElementById('resume-paper').outerHTML;
            const fullHTML = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Resume</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body { background:#080c14; color:#f3f4f6; min-height:100vh; padding:40px 20px; display:flex; justify-content:center; }
        #resume-paper { width:100%; max-width:680px; background:#0f172a; border:1px solid #1e293b; border-radius:16px; padding:35px; box-shadow:0 10px 30px rgba(0,0,0,0.5); }
        .profile-header { display:flex; align-items:center; gap:25px; border-bottom:1px solid #1e293b; padding-bottom:25px; margin-bottom:25px; }
        .avatar-box { width:100px; height:100px; border-radius:50%; overflow:hidden; border:3px solid #6366f1; box-shadow:0 0 15px rgba(99,102,241,0.4); flex-shrink:0; }
        .avatar-box img { width:100%; height:100%; object-fit:cover; }
        .resume-name { font-size:2rem; font-weight:700; color:#ffffff; }
        .resume-email { color:#9ca3af; font-size:0.85rem; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
        .resume-title { color:#38bdf8; font-size:1rem; font-weight:600; margin-bottom:10px; }
        .social-row { display:flex; flex-direction:column; gap:6px; }
        .social-links-btns { display:flex; gap:12px; }
        .social-link-btn { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:20px; background:#1e293b; color:#e2e8f0; text-decoration:none; font-size:0.85rem; border:1px solid #334155; transition:0.3s; }
        .social-link-btn:hover { border-color:#818cf8; color:#818cf8; transform:translateY(-2px); }
        .pdf-url-text { display:none; }
        .animated-card { background:#162032; border:1px solid #1e293b; border-radius:12px; padding:22px; margin-bottom:20px; transition:0.3s; }
        .project-item { border-bottom:1px solid #1e293b; padding-bottom:12px; margin-bottom:12px; }
        .project-item:last-child { border-bottom:none; padding-bottom:0; margin-bottom:0; }
        .education-card { padding:26px; min-height:110px; }
        .animated-card:hover { border-color:#6366f1; transform:translateY(-3px); box-shadow:0 8px 20px rgba(99,102,241,0.15); }
        .section-title { font-size:1rem; color:#818cf8; margin-bottom:12px; display:flex; align-items:center; gap:8px; font-weight:700; text-transform:uppercase; }
        .skills-wrapper { display:flex; flex-wrap:wrap; gap:8px; }
        .skill-chip { background:rgba(99,102,241,0.15); color:#a5b4fc; border:1px solid rgba(99,102,241,0.3); padding:5px 14px; border-radius:20px; font-size:0.85rem; }
    </style>
</head>
<body>
    ${paperContent}
</body>
</html>`;
            
            const blob = new Blob([fullHTML], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'resume.html';
            a.click();
        }

        // Print/Save PDF Function
        function exportPDF() {
            window.print();
        }
    </script>
</body>
</html>
